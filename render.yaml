services:
  - type: web
    name: contribhq-backend
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=@contribhq/server
    startCommand: npm start --workspace=@contribhq/server
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_PAT
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: CORS_ORIGIN
        value: "*"
